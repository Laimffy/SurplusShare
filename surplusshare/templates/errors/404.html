{% extends "base.html" %}

{% block title %}404 Not Found — SurplusShare{% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-8 col-lg-6 text-center">
    <div class="card rounded-4 shadow-sm border-0 bg-surface p-4 p-md-5">
      <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-sage text-forest mb-3 mx-auto shadow-sm" style="width: 72px; height: 72px;">
        <i data-lucide="compass" style="width: 36px; height: 36px;"></i>
      </div>
      
      <h2 class="h3 font-heading fw-bold text-forest mb-2">404 — Page Not Found</h2>
      <p class="text-charcoal mb-4">
        The page or resource you are looking for does not exist or may have been moved.
      </p>

      <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('public.home') }}" class="btn btn-leaf rounded-pill px-4">
          <i data-lucide="home" class="me-1"></i> Return Home
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
